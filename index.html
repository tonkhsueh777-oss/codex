<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>今日物理小知识</title>
    <style>
      :root {
        --bg1: #0b1023;
        --bg2: #141b3d;
        --text: #ecf2ff;
        --accent: #ffd166;
        --card: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top right, #1d2858, var(--bg1) 45%),
          linear-gradient(135deg, var(--bg1), var(--bg2));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(760px, 100%);
        border: 1px solid var(--border);
        background: var(--card);
        backdrop-filter: blur(4px);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(1.6rem, 3vw, 2rem);
      }

      .fact {
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        line-height: 1.7;
        margin: 0 0 20px;
        min-height: 4.5em;
      }

      .animation-wrap {
        position: relative;
        height: 78px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.03),
          rgba(255, 255, 255, 0.09),
          rgba(255, 255, 255, 0.03)
        );
      }

      .ray {
        position: absolute;
        left: -35%;
        top: 50%;
        width: 36%;
        height: 3px;
        transform: translateY(-50%);
        background: linear-gradient(90deg, transparent 0%, #fff7c0 40%, #ffffff 100%);
        box-shadow: 0 0 12px #ffe8a3, 0 0 22px #ffe8a3;
        animation: ray-move 2.2s linear infinite;
      }

      .ray::after {
        content: "";
        position: absolute;
        right: -6px;
        top: -3px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 10px #fff, 0 0 20px #ffe8a3;
      }

      @keyframes ray-move {
        from {
          left: -35%;
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        to {
          left: 105%;
          opacity: 0;
        }
      }

      button {
        margin-top: 20px;
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 700;
        color: #1c2146;
        background: var(--accent);
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.02);
      }

      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>今日物理小知识</h1>
      <p id="fact" class="fact"></p>

      <div class="animation-wrap" aria-hidden="true">
        <div class="ray"></div>
      </div>

      <button id="nextBtn" type="button">下一条</button>
    </main>

    <script>
      const facts = [
        "光在真空中的速度约为每秒 299,792 公里，常近似写作每秒 30 万公里。",
        "声音在空气中的传播速度约为每秒 340 米，温度越高通常传播得越快。",
        "地球表面的重力加速度约为 9.8 米每二次方秒。",
        "牛顿第一定律指出：若不受外力作用，物体将保持静止或匀速直线运动。",
        "电流方向规定为正电荷移动方向，和电子实际移动方向相反。",
        "光既具有波动性，也具有粒子性，这被称为波粒二象性。",
        "真空并非“什么都没有”，量子层面仍可能出现短暂涨落。",
      ];

      const factEl = document.getElementById("fact");
      const nextBtn = document.getElementById("nextBtn");
      let currentIndex = -1;

      function showRandomFact() {
        let nextIndex = Math.floor(Math.random() * facts.length);

        if (facts.length > 1) {
          while (nextIndex === currentIndex) {
            nextIndex = Math.floor(Math.random() * facts.length);
          }
        }

        currentIndex = nextIndex;
        factEl.textContent = facts[currentIndex];
      }

      nextBtn.addEventListener("click", showRandomFact);
      showRandomFact();
    </script>
  </body>
</html>
